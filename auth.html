<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Аватар</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><main class="card">
<h1>АВАТАР</h1><p class="sub">Войдите, чтобы забронировать место</p>
<div class="tabs"><button id="tl" class="on" type="button">Вход</button><button id="tr" type="button">Регистрация</button></div>
<button class="btn g" id="gg" type="button">Войти через Google</button>
<p class="or">или по почте</p>
<input id="nm" placeholder="Ваше имя" autocomplete="name" hidden>
<input id="em" type="email" placeholder="Почта" autocomplete="email">
<input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
<p class="err" id="er" role="alert"></p>
<button class="btn" id="go" type="button">Войти</button>
<p class="sub" style="margin-top:16px"><a href="index.html">← На главную</a></p>
</main>
<script type="module">
import {auth} from "./firebase-config.js";
import {GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const $=id=>document.getElementById(id);let reg=false;
const MSG={"auth/invalid-credential":"Неверная почта или пароль","auth/email-already-in-use":"Эта почта уже зарегистрирована","auth/weak-password":"Пароль слишком короткий","auth/invalid-email":"Проверьте адрес почты","auth/popup-closed-by-user":"Окно входа закрыто","auth/unauthorized-domain":"Домен не добавлен в Firebase (Authorized domains)"};
const show=e=>$("er").textContent=MSG[e.code]||"Ошибка: "+e.message;
function mode(r){reg=r;$("tl").className=r?"":"on";$("tr").className=r?"on":"";$("nm").hidden=!r;$("go").textContent=r?"Зарегистрироваться":"Войти";$("er").textContent=""}
$("tl").onclick=()=>mode(false);$("tr").onclick=()=>mode(true);
onAuthStateChanged(auth,u=>{if(u)location.href="booking.html"});
$("gg").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(show);
$("go").onclick=async()=>{try{
 if(reg){const c=await createUserWithEmailAndPassword(auth,$("em").value,$("pw").value);if($("nm").value)await updateProfile(c.user,{displayName:$("nm").value})}
 else await signInWithEmailAndPassword(auth,$("em").value,$("pw").value)
}catch(e){show(e)}};
</script></body></html>
