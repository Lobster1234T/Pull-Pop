<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0084d4;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0e27" opacity="0.5"/>
  
  <!-- Monitor screens -->
  <g>
    <!-- Screen 1 -->
    <rect x="30" y="50" width="100" height="80" rx="8" fill="none" stroke="url(#pcGrad)" stroke-width="2"/>
    <rect x="35" y="55" width="90" height="70" fill="#00d9ff" opacity="0.1"/>
    
    <!-- Screen 2 -->
    <rect x="150" y="40" width="110" height="90" rx="8" fill="none" stroke="url(#pcGrad)" stroke-width="2"/>
    <rect x="155" y="45" width="100" height="80" fill="#0084d4" opacity="0.15"/>
    
    <!-- Screen 3 -->
    <rect x="280" y="60" width="100" height="75" rx="8" fill="none" stroke="url(#pcGrad)" stroke-width="2"/>
    <rect x="285" y="65" width="90" height="65" fill="#00d9ff" opacity="0.1"/>
  </g>
  
  <!-- Keyboards/Base -->
  <g>
    <rect x="25" y="140" width="110" height="15" rx="3" fill="#00d9ff" opacity="0.2" stroke="url(#pcGrad)" stroke-width="1"/>
    <rect x="145" y="145" width="120" height="15" rx="3" fill="#0084d4" opacity="0.2" stroke="url(#pcGrad)" stroke-width="1"/>
    <rect x="275" y="150" width="110" height="15" rx="3" fill="#00d9ff" opacity="0.2" stroke="url(#pcGrad)" stroke-width="1"/>
  </g>
  
  <!-- Gaming chairs -->
  <g>
    <rect x="50" y="170" width="70" height="80" rx="5" fill="none" stroke="url(#pcGrad)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="85" cy="250" r="15" fill="url(#pcGrad)" opacity="0.4"/>
    
    <rect x="180" y="175" width="70" height="80" rx="5" fill="none" stroke="url(#pcGrad)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="215" cy="255" r="15" fill="url(#pcGrad)" opacity="0.4"/>
    
    <rect x="300" y="170" width="70" height="80" rx="5" fill="none" stroke="url(#pcGrad)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="335" cy="250" r="15" fill="url(#pcGrad)" opacity="0.4"/>
  </g>
</svg>
