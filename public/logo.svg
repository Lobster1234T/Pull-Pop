<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0084d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#logoGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Zap shape -->
  <g transform="translate(100, 100)">
    <!-- Top point -->
    <path d="M 0 -35 L 15 -5 L 5 -5 L 25 35 L 0 10 L -15 10 Z" fill="url(#logoGradient)" filter="url(#glow)"/>
    
    <!-- Ring around zap -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ff006e" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  </g>
</svg>
